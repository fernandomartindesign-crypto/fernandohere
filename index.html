<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERNANDO MARTIN</title>
  
  <!-- Google Fonts: Playfair Display & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff; /* White text required for 'difference' blend mode */
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
      overflow: hidden;
    }

    /* Fullscreen background video */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover; /* Stretches and crops video to fill full screen without stretching ratio */
      z-index: -1;
    }

    /* Main Content Container */
    .container {
      max-width: 440px;
      width: 100%;
      position: relative;
      z-index: 1;
      
      /* Dynamic contrast blending mode */
      mix-blend-mode: difference;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.85rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .status {
      font-size: 0.8rem;
      font-weight: 300;
      margin-bottom: 20px;
    }

    .contact-section {
      padding-top: 0;
    }

    .contact-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 6px;
    }

    .links {
      font-size: 0.88rem;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .links a {
      color: #ffffff;
      font-weight: 400;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .links a:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- Background Video Element -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="BG.mp4" type="video/mp4">
  </video>

  <!-- Text Layer -->
  <div class="container">
    <h1>FERNANDO&nbsp;&nbsp;&nbsp;MARTIN</h1>
    <p class="tagline">Artist  /  Director  /  Mercenary</p>
    <p class="status">site under maintenance</p>

    <div class="contact-section">
      <p class="contact-title">get in touch:</p>
      <div class="links">
        <a href="mailto:contact@fernandohere.com">contact@fernandohere.com</a>
        <a href="https://instagram.com/fernandohere" target="_blank" rel="noopener">IG: @fernandohere</a>
      </div>
    </div>
  </div>

</body>
</html>
