<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERNANDO MARTIN</title>
  
  <!-- Google Fonts: Playfair Display (Title) & Nunito (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,600;1,300&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #fafafa;
      color: #1a1a1a;
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px 16px;
    }

    .container {
      max-width: 440px; /* Tightened horizontal container */
      width: 100%;
    }

    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
      color: #111111;
    }

    .tagline {
      font-size: 0.9rem;
      font-weight: 400;
      color: #555555;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .status {
      font-size: 0.8rem;
      font-weight: 300;
      font-style: italic;
      color: #888888;
      margin-bottom: 40px;
    }

    .contact-section {
      border-top: 1px solid #e5e5e5;
      padding-top: 28px;
    }

    .contact-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888888;
      margin-bottom: 12px;
    }

    .links {
      font-size: 0.9rem;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .links a {
      color: #1a1a1a;
      font-weight: 400;
      text-decoration: none;
      border-bottom: 1px solid #cccccc;
      padding-bottom: 2px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .links a:hover {
      border-color: #1a1a1a;
      color: #000000;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FERNANDO MARTIN</h1>
    <p class="tagline">Artist / Director / Mercenary</p>
    <p class="status">site under maintenance</p>

    <div class="contact-section">
      <p class="contact-title">get in touch</p>
      <div class="links">
        <a href="mailto:contact@fernandohere.com">contact@fernandohere.com</a>
        <a href="https://instagram.com/fernandohere" target="_blank" rel="noopener">IG: @fernandohere</a>
      </div>
    </div>
  </div>
</body>
</html>
