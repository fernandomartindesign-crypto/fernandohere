<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FERNANDO MARTIN</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d0d0d;
      color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 1rem;
      color: #888888;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    .status {
      font-size: 0.85rem;
      color: #555555;
      letter-spacing: 0.05em;
      text-transform: lowercase;
      margin-bottom: 48px;
    }
    .contact-title {
      font-size: 0.9rem;
      color: #888888;
      margin-bottom: 12px;
    }
    .links {
      font-size: 0.95rem;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .links a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid #444444;
      padding-bottom: 2px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .links a:hover {
      border-color: #ffffff;
      color: #cccccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FERNANDO MARTIN</h1>
    <p class="tagline">Artist / Director / Mercenary</p>
    <p class="status">site under maintenance</p>

    <div class="contact-section">
      <p class="contact-title">get in touch:</p>
      <div class="links">
        <a href="mailto:contact@fernandohere.com">contact@fernandohere.com</a>
        <a href="https://instagram.com/fernandohere" target="_blank" rel="noopener">IG: @fernandohere</a>
      </div>
    </div>
  </div>
</body>
</html>
